name: Build

on:
  push:
    tags: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v3
      with:
        nuget-version: latest

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Configure Git to use HTTPS
      run: git config --global url."https://github.com/".insteadOf git://github.com/
    
    - name: Generate resources
      shell: pwsh
      run: |
        cd translate
        pip install -r requirements.txt
        python po2ymo.py ./source/zh_CN.po ./generated/zh_CN.ymo
        python po2ymo.py ./source/zh_TW.po ./generated/zh_TW.ymo
        @"
        #include "../../targetver.h"
        #include "windows.h"
        
        LANGUAGE LANG_CHINESE, SUBLANG_CHINESE_SIMPLIFIED
        1 YMO "zh_CN.ymo"
        
        LANGUAGE LANG_CHINESE, SUBLANG_CHINESE_TRADITIONAL
        1 YMO "zh_TW.ymo"
        "@ | Out-File -FilePath ./generated/translate.rc -Encoding utf8

    - name: Restore NuGet packages
      run: nuget restore AudioPlaybackConnector.sln


    - name: Build x86 Release
      shell: powershell
      run: |
        msbuild AudioPlaybackConnector.sln `
          -p:Configuration=Release `
          -p:Platform=x86

    - name: Build x64 Release
      shell: powershell
      run: |
        msbuild AudioPlaybackConnector.sln `
          -p:Configuration=Release `
          -p:Platform=x64

    - name: Build ARM Release
      shell: powershell
      run: |
        msbuild AudioPlaybackConnector.sln `
          -p:Configuration=Release `
          -p:Platform=ARM

    - name: Build ARM64 Release
      shell: powershell
      run: |
        msbuild AudioPlaybackConnector.sln `
          -p:Configuration=Release `
          -p:Platform=ARM64


    - name: Upload x86 artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector-x86
        path: Release/Win32/AudioPlaybackConnector32.exe

    - name: Upload x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector-x64
        path: Release/x64/AudioPlaybackConnector64.exe

    - name: Upload ARM artifact
      uses: actions/upload-artifact@v4
      with: 
        name: AudioPlaybackConnector-ARM
        path: Release/ARM/AudioPlaybackConnectorARM.exe

    - name: Upload ARM64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector-ARM64
        path: Release/ARM64/AudioPlaybackConnectorARM64.exe

    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: |
          Release/Win32/AudioPlaybackConnector32.exe
          Release/x64/AudioPlaybackConnector64.exe
          Release/ARM/AudioPlaybackConnectorARM.exe
          Release/ARM64/AudioPlaybackConnectorARM64.exe
        tag_name: ${{ github.ref }}
        name: ${{ github.ref }}
        draft: true
        prerelease: false